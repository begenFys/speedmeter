[project]
name = "speedmeter-ad-robot"
version = "0.1.0"
description = "CLI-утилита для замера скорости скачивания: несколько последовательных запросов к URL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
speedmeter = "speedmeter.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
